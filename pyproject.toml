[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "touchgrind-skate2-save-editor"
version = "1.0.0"
description = "Standalone WebGUI Save Editor for Touchgrind Skate 2 (iOS) with zero third-party dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["touchgrind", "skate2", "save-editor", "ios-modding", "skeuomorphism"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.scripts]
touchgrind-skate2-editor = "editor.server:main"

[tool.setuptools.packages.find]
include = ["editor*", "editor.web*"]
